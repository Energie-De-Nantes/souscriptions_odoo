site_name: Souscriptions — la doc educpopage
site_url: https://energie-de-nantes.github.io/souscriptions_odoo/

docs_dir: docs/educpopage

theme:
  name: material
  palette:
    # `custom` = les couleurs viennent des variables --md-* de stylesheets/cozy.css
    # (palette « Warm Cosy », copiée depuis la doc electricore — copie, pas dépendance).
    scheme: default
    primary: custom
    accent: custom

extra_css:
  - stylesheets/cozy.css

plugins:
  - search

# validation.links n'a pas de niveau `error` dans cette version de MkDocs (seulement
# warn/info/ignore) : `warn` est le niveau le plus strict disponible, et c'est bien
# `mkdocs build --strict` (garde-fou CI) qui transforme un warning en échec — un lien
# interne mort ou une page hors nav casse donc la CI.
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

exclude_docs: "*.excalidraw"

nav:
  - Accueil: index.md
  - Vue d'ensemble: resume.md
  - Le contrat de fourniture: contrat.md
  - Les prix: prix.md
  - Facturer le mois: facturer.md
  - Régulariser: regulariser.md
  - Encaisser: encaisser.md
  - Le raccordement: raccordement.md
  - Le portail client: portail.md
  - Les mails: mails.md
  - Le consentement données conso: consentement.md
