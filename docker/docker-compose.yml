services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      # DB/LOAD_DEMO : source de vérité unique pour scripts/dev.sh ; défauts ici
      # pour que `docker compose up` marche aussi hors dev.sh (mode demo).
      - DB=${DB:-souscriptions_demo}
      - LOAD_DEMO=${LOAD_DEMO-1}
      # Repli config electricore en dev : renseignés dans docker/.env (non commité),
      # lus en dernier recours par la fabrique quand les paramètres système sont vides.
      - ELECTRICORE_URL=${ELECTRICORE_URL:-}
      - ELECTRICORE_API_KEY=${ELECTRICORE_API_KEY:-}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../:/mnt/extra-addons/souscriptions_odoo:rw
      # Masque .claude (worktrees d'agents) : leurs checkouts déclenchaient
      # l'autoreload --dev et coupaient les connexions en vol.
      - /mnt/extra-addons/souscriptions_odoo/.claude
    command: >
      odoo
      --db_host=db
      --db_user=odoo
      --db_password=odoo
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --load-language=fr_FR
      --max-cron-threads=0
      --dev=reload,xml,qweb

volumes:
  odoo-db-data:
  odoo-web-data:
